name: Android CI

on:
  push:
    branches:
      - main
      - "camera-guide-hardening-*"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and build release APK
        run: ./gradlew test :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smart-tesla-release
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
